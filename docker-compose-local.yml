services:
  # RAG Testing API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-testing-api
    environment:
      - POSTGRES_HOST=host.docker.internal # Connect to host machine's PostgreSQL
      - POSTGRES_PORT=5432
      - POSTGRES_DB=rag_testing
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=changeme
      - OLLAMA_BASE_URL=http://host.docker.internal:11434 # Connect to host machine's Ollama
      - ENVIRONMENT=docker
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - embeddings_cache:/app/.cache
    networks:
      - rag-network
    extra_hosts:
      - "host.docker.internal:host-gateway" # Enable host.docker.internal on Linux
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional: Elasticsearch (if you want to compare with pgvector)
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
  #   container_name: rag-testing-elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #   ports:
  #     - "9200:9200"
  #   volumes:
  #     - elasticsearch_data:/usr/share/elasticsearch/data
  #   networks:
  #     - rag-network

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  embeddings_cache:
    driver: local
  # elasticsearch_data:
  #   driver: local

networks:
  rag-network:
    driver: bridge
