services:
  # RAG Testing API
  # PostgreSQL with pgvector extension - comment if using local PostgreSQL
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-testing-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS}
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:${POSTGRES_PORT}" # Map to 5433 to avoid conflict with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-testing-api
    environment:
      - POSTGRES_HOST=postgres # Connect to postgres container via Docker network
      # - POSTGRES_HOST=host.docker.internal # Connect to host machine's PostgreSQL
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434 # Connect to host machine's Ollama
      - ENVIRONMENT=docker
      # Cloud provider API keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - COPILOT_API_KEY=${COPILOT_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - embeddings_cache:/app/.cache
    networks:
      - rag-network
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway" # Enable host.docker.internal on Linux
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional: Elasticsearch (if you want to compare with pgvector)
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
  #   container_name: rag-testing-elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #   ports:
  #     - "9200:9200"
  #   volumes:
  #     - elasticsearch_data:/usr/share/elasticsearch/data
  #   networks:
  #     - rag-network

volumes:
  postgres_data:
    driver: local
  embeddings_cache:
    driver: local
  # elasticsearch_data:
  #   driver: local

networks:
  rag-network:
    driver: bridge
