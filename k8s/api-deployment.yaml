apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-testing-api
  namespace: rag-testing
  labels:
    app: rag-testing-api
spec:
  replicas: 2  # Can scale horizontally
  selector:
    matchLabels:
      app: rag-testing-api
  template:
    metadata:
      labels:
        app: rag-testing-api
    spec:
      initContainers:
      # Wait for postgres to be ready
      - name: wait-for-postgres
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          until nc -z postgres 5432; do
            echo "Waiting for postgres..."
            sleep 2
          done
      # Wait for ollama to be ready
      - name: wait-for-ollama
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          until nc -z ollama 11434; do
            echo "Waiting for ollama..."
            sleep 2
          done
      containers:
      - name: api
        image: rag-testing-api:latest  # Build and push to your registry
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        # PostgreSQL configuration
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rag-testing-secret
              key: POSTGRES_PASSWORD
        # Ollama configuration
        - name: OLLAMA_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: OLLAMA_BASE_URL
        # Application configuration
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: ENVIRONMENT
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: API_PORT
        - name: DB_POOL_SIZE
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: DB_POOL_SIZE
        # Embedding configuration
        - name: EMBEDDING_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: EMBEDDING_PROVIDER
        - name: EMBEDDING_MODEL
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: EMBEDDING_MODEL
        - name: EMBEDDING_DIMENSION
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: EMBEDDING_DIMENSION
        # LLM configuration
        - name: LLM_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: LLM_PROVIDER
        - name: LLM_MODEL
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: LLM_MODEL
        - name: LLM_TEMPERATURE
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: LLM_TEMPERATURE
        # Chunking configuration
        - name: CHUNK_SIZE
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: CHUNK_SIZE
        - name: CHUNK_OVERLAP
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: CHUNK_OVERLAP
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
