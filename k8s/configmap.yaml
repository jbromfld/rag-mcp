apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-testing-config
  namespace: rag-testing
  labels:
    app: rag-testing-pipeline
data:
  # PostgreSQL configuration
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "rag_testing"
  POSTGRES_USER: "testuser"

  # Ollama configuration
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_HOST: "0.0.0.0"

  # Application configuration
  ENVIRONMENT: "kubernetes"
  API_PORT: "8000"
  DB_POOL_SIZE: "20"

  # Chunking configuration (defaults)
  CHUNK_SIZE: "300"
  CHUNK_OVERLAP: "30"

  # Embedding configuration (local)
  EMBEDDING_PROVIDER: "local"
  EMBEDDING_MODEL: "all-mpnet-base-v2"
  EMBEDDING_DIMENSION: "768"

  # LLM configuration (local)
  LLM_PROVIDER: "ollama"
  LLM_MODEL: "llama3.2"
  LLM_TEMPERATURE: "0.7"
