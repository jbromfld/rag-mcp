# Kustomization file for easy deployment
# Usage: kubectl apply -k k8s/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rag-testing

resources:
  # Namespace and Configuration
  - namespace.yaml
  - configmap.yaml
  - secret.yaml

  # Storage
  - postgres-pvc.yaml
  - ollama-pvc.yaml

  # PostgreSQL
  - postgres-deployment.yaml
  - postgres-service.yaml

  # Ollama
  - ollama-deployment.yaml
  - ollama-service.yaml

  # API
  - api-deployment.yaml
  - api-service.yaml

  # Ingress (optional)
  # - ingress.yaml

# Common labels applied to all resources
commonLabels:
  project: rag-testing
  managed-by: kustomize

# Images to use (update with your registry)
images:
  - name: rag-testing-api
    newName: gcr.io/your-project/rag-testing-api  # Change this
    newTag: latest
