apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: rag-testing
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate  # Important for stateful services
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
          name: ollama
        env:
        - name: OLLAMA_HOST
          valueFrom:
            configMapKeyRef:
              name: rag-testing-config
              key: OLLAMA_HOST
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: ollama-pvc
      # Uncomment if you have GPU nodes with nvidia-docker runtime
      # nodeSelector:
      #   cloud.google.com/gke-accelerator: nvidia-tesla-t4
      # tolerations:
      # - key: nvidia.com/gpu
      #   operator: Exists
      #   effect: NoSchedule
